server:
  port: 8083

spring:
  kafka:
#    bootstrap-servers: localhost:9092
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false   # ← ignore __TypeId__ header
        spring.json.value.default.type: com.example.notificationservice.event.RiskEvaluatedEvent

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.info: false      # ← don't embed type headers when producing
management:
  endpoints:
    web:
      exposure:
        include: health,info
